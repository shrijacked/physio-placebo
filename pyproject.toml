[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "physio-placebo"
version = "0.1.0"
description = "Surrogate-controlled audit of LLM physiological-state classification (WESAD / MAUS / CogWear)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "neurokit2==0.2.13",
    "cvxopt==1.3.3",
    "pyarrow==25.0.1",
    "PyYAML==6.0.3",
    "matplotlib==3.11.1",
    "tqdm==4.70.0",
    "openai==3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]
# Vendored third-party code is kept byte-identical to upstream; never lint or reformat it.
extend-exclude = ["src/physio_placebo/prompts/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
