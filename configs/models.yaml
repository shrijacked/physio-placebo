# Open-weights stack (OSF deviation 2026-09-16). vLLM 0.29 dropped
# bitsandbytes; the A6000 48GB box runs these in fp16.

quantization: null
dtype: float16
# 4-shot Paradigm A series prompts overflowed 8192 on Qwen3 (8193 tokens).
max_model_len: 32768
max_tokens: 1
temperature: 0.0
# Request these token ids from the full-vocab softmax. Do not set
# allowed_token_ids — that would renormalize and is not the OSF rule.
logprobs_topk: 32

models:
  qwen3_8b:
    hf_id: Qwen/Qwen3-8B
    chat_kwargs:
      enable_thinking: false
  llama31_8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    chat_kwargs: {}
  qwen25_vl:
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    chat_kwargs: {}
    # 4-shot C = 4 exemplar plots + query. Keep context below the A/B 32k.
    max_model_len: 16384
    limit_mm_per_prompt:
      image: 5
