# Window extraction parameters, one block per dataset.
# Any change here changes the config hash; processed windows and features must be
# regenerated into a NEW directory (results are never overwritten, rule 1.7).
#
# Windows are cut strictly inside a single labeled protocol segment (purity = 1.0
# by construction; no mixed-condition windows).

wesad:
  window_s: 60.0
  stride_s: 30.0
  # Standard WESAD binary task: stress vs non-stress.
  # label map (WESAD protocol codes): 1=baseline, 2=stress (TSST), 3=amusement,
  # 4=meditation, 0/5/6/7=undefined/ignored.
  positive: [2]        # stress
  negative: [1, 3]     # baseline + amusement
  excluded: [0, 4, 5, 6, 7]
  # channels used (defined in loader): chest ECG@700Hz, chest EDA@700Hz,
  # chest Resp@700Hz, wrist BVP@64Hz, wrist EDA@4Hz

cogwear:
  window_s: 60.0
  stride_s: 30.0
  # Cognitive effort task: Stroop (cognitive_load) = 1 vs resting baseline = 0.
  # channels used (defined in loader): Empatica E4 BVP@64Hz, EDA@4Hz

maus:
  window_s: 60.0
  stride_s: 30.0
  # Mental workload under n-back: 0-back = low (0) vs 2-back & 3-back = high (1).
  # Trial blocks come from the per-subject trigger/timing files.
  positive_nback: [2, 3]
  negative_nback: [0]
  # channels used (defined in loader): wrist PixArt PPG@100Hz, palm GSR (Shimmer)
