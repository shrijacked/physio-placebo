# Locked comparison recipe. Do not sweep.
# Source: Health-LLM Appendix A (arXiv 2401.06866v2) plus kbressem/medAlpaca
# train.py defaults, which that appendix says to follow.
# The released finetune.sh is a different cell (full fine-tune of llama-13b-bf,
# use_lora false, 5 epochs, 4 GPUs). We do not run that cell.

frozen: true
cell: healthllm_table4_pmdata_stress_medalpaca7b
paper_table4_pmdata_stress_mae: 0.38
paper_zero_shot_medalpaca_mae: 0.76
paper_zero_shot_medalpaca_sd: 0.10

model: medalpaca/medalpaca-7b
use_lora: true
train_in_8bit: false
torch_dtype: float16
lora_r: 8
lora_alpha: 16
lora_dropout: 0.1
lora_target_modules:
  - q_proj
  - v_proj
num_epochs: 3
learning_rate: 2.0e-5
optim: adamw_torch
lr_scheduler_type: cosine
warmup_steps: 0
warmup_steps_in_paper: 100
global_batch_size: 128
per_device_batch_size: 1
gradient_accumulation_steps: 128
model_max_length: 2048
medalpaca_default_max_length: 256
val_set_size: 0
seed: 42
train_on_inputs: true
prompt_template: medalpaca
gradient_checkpointing: true
oversample: false
eval_seed: 0
max_new_tokens: 120
do_sample: false
return_full_text: false

deviations:
  - id: lora_not_full_ft
    text: >
      Appendix A says parameters are updated and that further knobs follow
      MedAlpaca defaults. Those defaults set use_lora true (r=8, alpha=16,
      dropout=0.1, q_proj and v_proj). finetune.sh overrides that to a full
      fine-tune of llama-13b-bf. This lock follows the 7B appendix cell
      (3 epochs) and the MedAlpaca LoRA defaults, not finetune.sh.
  - id: fp16_not_8bit
    text: >
      MedAlpaca train.py defaults train_in_8bit to true. This lock uses fp16,
      the same dtype as the locked zero-shot anchor on the A6000.
  - id: max_length_2048
    text: >
      MedAlpaca's default model_max_length is 256. The longest PMData stress
      example in the released train pool is 1416 characters, so 256 tokens
      would cut off the sensor text. 2048 is the LLaMA context the MedAlpaca
      trainer itself names as the ceiling.
  - id: per_device_batch_1
    text: >
      Effective batch stays 128 (paper batch size) via gradient accumulation.
      Per-device batch is 1 so one 48 GB GPU can hold fp16 7B at length 2048.
      MedAlpaca's per-device default is 2.
  - id: warmup_0
    text: >
      The paper's warmup is 100 steps on the merged, oversampled multi-dataset
      run. This cell trains on the PMData stress complement only (653 rows).
      At batch 128 that is about 16 optimizer steps, so warmup 100 would never
      reach the stated learning rate. Warmup is 0 here.
  - id: no_oversample
    text: >
      Appendix A oversamples and merges datasets for the multi-task fine-tune.
      It does not publish the oversampling rule for the single-dataset Table 4
      cell. This lock does not oversample.
  - id: no_inner_val_split
    text: >
      MedAlpaca train.py defaults val_set_size to 0.1 and would hold out part
      of the train pool. The only eval is the locked 299-item split, so
      val_set_size is 0.
  - id: greedy_decode
    text: >
      Appendix A says sampling decode. The locked anchor scorer is greedy
      first-number MAE (do_sample false, max_new_tokens 120). Eval uses that
      scorer. It is not retuned.
  - id: split
    text: >
      Train rows are PMData_stress_train_all.json minus any sensor text that
      also appears in the locked 299-item eval (sha256 fea3b879…). The released
      pool has one such overlap; it is dropped. Their paper describes a 10%
      test split. We do not claim this eval is that split. Scoring the locked
      eval makes the fine-tune MAE comparable to our zero-shot 2.689.
