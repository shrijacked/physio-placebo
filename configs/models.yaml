# Open-weights stack for Weeks 4–5 (OSF deviation 2026-09-16).
# Same HF ids as the OSF comment. vLLM 0.29 dropped bitsandbytes; the A6000
# 48GB box runs these 8B checkpoints in fp16. Do not add a vision model (Week 6).

quantization: null
dtype: float16
# 4-shot Paradigm A series prompts overflowed 8192 on Qwen3 (8193 tokens).
max_model_len: 32768
max_tokens: 1
temperature: 0.0
# Request these token ids from the full-vocab softmax. Do not set
# allowed_token_ids — that would renormalize and is not the OSF rule.
logprobs_topk: 32

models:
  qwen3_8b:
    hf_id: Qwen/Qwen3-8B
    chat_kwargs:
      enable_thinking: false
  llama31_8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    chat_kwargs: {}
